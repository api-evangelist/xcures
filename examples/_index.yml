api: xCures Public API
summary: >-
  xCures ships example values densely at the SCHEMA-PROPERTY level and almost not at all at the
  RESPONSE-BODY level. 361 `example` keys appear in the 290KB contract; 170 of them sit directly on top-level schema
  properties (Subject.firstName "David", Subject.addressState "MN", Application.birthDate "2023-05-26",
  ids as real-shaped UUIDs) and the rest are nested inside those schemas. Only 12 example bodies are
  attached at the response level across 69 operations — the v2 subject-create 409 ProblemDetails is the
  clearest one. So a generated
  client gets realistic field-level values but a developer gets few complete request/response pairs FROM
  THE SPEC. The gap is filled outside the spec, and well: the Postman collection carries 75+ executable
  requests wired end to end, and the Redocly reference renders code samples in eight languages.
