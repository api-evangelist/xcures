source: >-
  openapi/xcures-patient-registry-api-openapi.yml — components.schemas $ref links and *Id reference
  fields, enriched from https://docs.xcures.com/api-introduction (entity glossary) and the spec's own
  tag descriptions
api: xCures Public API
schema_count: 64
entities:
  - name: Project
    role: >-
      The tenancy boundary and the unit of entitlement. Its UUID is the ProjectId header required on 67 of
      69 operations, and permissions are granted per credential per project. A project also carries a
      workflow type (Standard Treatment, Retrieval Only, BYOD, IAS) that determines whether reciprocity is
      obligatory.
    id_format: uuid
    discovery: GET /api/v1/patient-registry/project
  - name: Subject
    role: >-
      An individual patient on the xCures Platform, and the root of everything else. The id is
      CLIENT-SUPPLIED — the caller generates the UUID — which is what makes creation replay-safe (409 on a
      duplicate). Also carries a server-assigned human-readable 6-character `identifier`, a read-only
      `deleted` timestamp, and demographic fields whose completeness drives patient-matching quality
      across the exchange networks.
    id_format: uuid (client-supplied)
    tag: Subject
  - name: Application
    role: >-
      The IAS onboarding record: identity proofing and eConsent a patient must complete before progressing
      on the platform. Holds the three webhook callback URLs and resolves to a Subject once accepted.
    id_format: uuid (client-supplied)
    tag: Application
  - name: Query
    role: >-
      A dispatched request for a patient's records across Carequality/TEFCA. Asynchronous: fhirStatus and
      ccdaStatus each walk delayed -> initiated -> pending -> inProgress -> completed | exhausted | error,
      and queryAttempts records the per-network attempts.
    id_format: string
    tag: Query
  - name: Document
    role: >-
      A retrieved or uploaded patient record. Source is one of fhir, ccda, box, userUpload, patientFhir.
      Carries a signedS3Url for direct transfer and can be published back to the network for reciprocity.
    schemas: [DocumentDetail, DocumentSummary, CreateDocumentRequest, CreateDocumentResponse, UpdateDocumentRequest, DocumentReciprocityDto, DocumentPdfUrlDto, DocumentSectionDto]
    tag: Document
  - name: ClinicalConcept
    role: >-
      "A proprietary xCures higher-level, flattened, filtered, opinionated view of medical record
      information, structured around FHIR guidelines" (spec tag text). Fifteen typed DTOs — condition,
      medication, allergy, procedure, biomarker, coverage, demographic, encounter, family_history,
      imaging, lab, social_history, survey, radiation, vital — each with a search and a get-by-id
      operation, all filterable by code + codeSystem.
    variants: 15
    tag: Clinical Concepts
  - name: Checklist
    role: >-
      The AI decision surface. A checklist definition holds ChecklistItems; evaluating it against a
      subject returns a ChecklistEvaluationResult whose items each carry a justification, the
      ClinicalConcepts consulted and the DocumentSections cited — the provenance chain the trust page
      describes.
    tag: Checklist
  - name: SubjectSummary
    role: AI-generated narrative of a subject's overall record, with referencedDocuments citations.
    tag: Summary
  - name: ReciprocityTemplate
    role: >-
      A per-project document template (PublishDocumentTemplateDto) selected when publishing a document
      back to the network. Scoped to a project and a provider organization.
    tag: Reciprocity Template
  - name: FHIR resources
    role: >-
      Twelve FHIR R4 resource reads plus a bulk _export. Not modelled as components.schemas — the
      responses are declared by reference to https://hl7.org/fhir/R4/bundle.html, so the FHIR shapes come
      from the standard rather than from this contract.
    tag: FHIR
core_graph:
  - Project has_many Subject (via the ProjectId header, not a body field)
  - Subject has_many Query
  - Subject has_many Document
  - Subject has_many ClinicalConcept (all 15 types, via the subjectId query parameter)
  - Subject has_one SubjectSummary
  - Subject has_many ChecklistEvaluationResult
  - Application resolves_to Subject
  - Query has_many QueryAttempt
  - Checklist has_many ChecklistItem
  - ChecklistEvaluationResult has_many ChecklistItemEvaluationResult
  - ChecklistItemEvaluationResult cites ClinicalConcept and DocumentSection
  - DocumentSection belongs_to Document
  - Document published_via ReciprocityTemplate
id_conventions:
  format: >-
    UUID v4 throughout, with no type prefixes (unlike Stripe-style prefixed ids). Subject, Application and
    Project ids are UUIDs; Query and Document ids are declared as plain strings. There is no way to tell
    an id's type from its value.
  client_supplied:
    - Subject.id
    - Application.id
  note: >-
    Client-supplied ids are the single most important modelling decision in this API. They are what make
    subject creation idempotent, they let a caller correlate their own records to xCures without a lookup
    table, and they are why a 409 is a success signal rather than a failure.
  external_identifiers: >-
    Subject.externalIdentifiers (SubjectExternalIdentifier[]) is the documented anchor for a caller's own
    MRN or system id, and the requery skill names it as a search field.
