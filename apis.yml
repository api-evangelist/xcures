aid: xcures
name: xCures
description: >-
  xCures operates the Clinical Clarity Engine, an AI platform that retrieves, organizes and structures fragmented
  patient medical records into decision-ready clinical data. Founded in 2018 and headquartered in Oakland, California,
  the company connects to national health information networks (Carequality and TEFCA) to pull a patient's longitudinal
  record across every provider and care location, then applies LLM-based named-entity/relation extraction and
  retrieval-augmented checklist assertion to normalize it into FHIR R4 resources, OHDSI/OMOP-mapped vocabularies
  (SNOMED, LOINC, RxNorm) and HL7 mCODE oncology elements, with every field anchored to its source document. The
  xCures Public API exposes that engine over REST at partner.xcures.com — patient (Subject) registration, network
  Query dispatch and polling, document retrieval and reciprocity publishing, FHIR resource reads and bulk export,
  fifteen Clinical Concepts domains, AI Checklist evaluation and subject summaries — authenticated with OAuth 2.0
  client-credentials bearer tokens scoped by a ProjectId header. Originally an oncology real-world-data platform, it
  expanded to all therapeutic areas and is sold as SaaS, embedded API connections and de-identified real-world
  datasets to providers, diagnostics companies, value-based-care organizations and channel partners.
