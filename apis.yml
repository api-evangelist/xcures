apis:
  - name: xCures Public API
    description: >-
      REST API for the xCures Clinical Clarity Engine. Register patients (Subjects), dispatch and poll queries against
      Carequality/TEFCA health information networks, retrieve and publish clinical documents (including reciprocity
      back to the network), read normalized FHIR R4 resources and a FHIR bulk export, search fifteen Clinical Concepts
      domains (conditions, medications, labs, biomarkers, imaging, procedures, allergies, vitals, encounters,
      demographics, coverage, family history, social history, surveys, radiation), evaluate AI Checklists, and fetch
      AI-generated subject summaries. OAuth 2.0 client-credentials bearer auth with a required ProjectId header on
      nearly every operation.
    humanURL: https://docs.xcures.com/apis/current
