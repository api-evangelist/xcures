finding: >-
  xCures ships NO first-party client library in any public package registry. Every registry was queried
  unauthenticated on 2026-09-04 and every one came back empty: npm search "xcures" total 0,
  pypi.org/pypi/xcures/json 404, rubygems.org/api/v1/gems/xcures.json 404, crates.io search total 0,
  packagist search empty, no Maven/NuGet coordinate. The company's GitHub organization
  (https://github.com/xCures, created 2019-11-01) is public but holds only two research repositories —
  dateparser_with_bounds (Python) and keras_lstm_vae (Jupyter) — neither of which is an API client.
  This matters because the surface LOOKS like it has SDKs: the docs footer carries an "SDKs" link, the
  changelog page is titled "Release notes and changes for the xCures API and client SDKs", and the
  Postman collection is named "xCures SDK — Workflow Playbook". What xCures calls its SDK is a
  documentation and Postman surface, not a distributed library.
