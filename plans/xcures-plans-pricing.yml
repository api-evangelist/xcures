note: >-
  xCures publishes no pricing of any kind. There is no /pricing page (https://xcures.com/pricing/ returns
  404), no plans or tiers page, no per-call rate card, and no free tier or self-serve signup. The site's
  only commercial calls to action are "Contact Us" and "Request a Demo", and API credentials are issued
  by a Customer Success Manager after a contract — the API Introduction opens with "Once you receive your
  xCures patient registry portal credentials from your Customer Success Manager". This is a
  contact-sales-only, enterprise-contracted API. Recorded as plan_count 0 deliberately rather than
  omitted: the absence is the finding.
