      - PublicSubjectController_search
      - PublicQueryController_search
      - PublicQueryController_create
      - PublicQueryController_get
      - PublicDocumentController_getAll
      - PublicClinicalConceptsController_searchConditions
  - tool: bulk-patient-onboarding
    category: patient-onboarding
    binding: skill-to-rest
    confidence: high
    rest:
      - PublicSubjectController_create
      - PublicQueryController_create
      - PublicQueryController_get
    note: >-
      Uses the v1 batch create (max 10 subjects per request, per-subject failureReason isolation), not
