mcp_only:
  - tool: signed-s3-upload
    reason: >-
      Three skills (byod-ingestion, retrieval-only, reciprocity) instruct an HTTP PUT of file bytes
      directly to the signedS3Url returned by PublicDocumentController_create. It is a pre-signed
      storage upload outside the xCures API surface, carries no Authorization header, and has no
      operationId in the spec — so it is a real step an agent must take that the OpenAPI does not
      describe.
  - tool: docs-search
    reason: >-
      The MCP server is described in the agent card as exposing "documentation tools and skills". Any
      documentation-retrieval tools it ships have no REST counterpart on partner.xcures.com. Names and
      schemas unknown — the endpoint is auth-gated and none is asserted.
rest_only_note: >-
  36 of the 69 REST operations are named by no published skill. They are listed in full below and are
  the surface an agent would have to work out from the OpenAPI alone: the entire IAS Application
  flow (identity proofing / eConsent / webhook registration), all 12 FHIR resource reads plus the FHIR
  bulk export, all 15 Clinical Concepts get-by-id operations, subject and document updates, checklist
  item feedback, and the project listing.
