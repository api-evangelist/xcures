note: >-
  xCures' MCP server (https://docs.xcures.com/mcp) is auth-gated, so its live tools/list could not be
  introspected and NO MCP tool names are asserted here. What xCures does publish unauthenticated is a
  six-entry Agent Skills catalog that the same MCP server fronts (the agent card lists exactly these six
  as its skills[]). This crosswalk therefore binds each PUBLISHED SKILL to the REST operations its own
  steps name, verbatim — every operationId below was grepped out of the spec, none inferred. Confidence
  is high throughout because each skill states its endpoints as literal method + path strings; it is not
  a semantic guess. Coverage counts are skill-to-REST, not tool-to-REST.
surfaces:
